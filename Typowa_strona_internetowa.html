<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8" />
    <title> Typowa witryna internetowa </title> 
<style  type="text/css">
    *{ box-sizing:border-box;}
    
    body { background:#551606; padding: 20px;}
    
    header { border:3px solid #B38481; width:100%; background:#ECC5C0;padding:20px;}

    nav { border:4px solid #ECC5C0; width:50%; padding:20px; background:#B38481;}

    main { float:left; width:60%; margin-top:2%; background:#ECC5C0; margin-bottom:2%;}

    section { border:4px solid #B38481; margin-bottom:2%; background:#ECC5C0;}

    article { border:4px solid #B38481;}

    aside { padding-left:2%; margin-top:2%; width:38%; float:right;}

    footer { border:4px solid #B38481; width:100%; clear:both; padding:20px; background:#ECC5C0;}

</style>
</head>
<body>
    <header>
        <h1> Typowa Witryna Internetowa </h1>
        
        <nav>   <ul>
                <li><a href="#"> Strona głowna </a></li>
                <li><a href="#"> Produk </a></li>
                <li><a href="#"> O nas </a></li>
                <li><a href="#"> Kontakt </a></li>
                </ul>
        </nav>
    </header>
<main>
    <article>
        <h2> Nagłówek </h2>
        <p> To jest tekst artykułu.
    </p>

        <p> Kolejny tekst artykułu. 
    </p>
    </article>
</main>
    <aside><section> <p> SEKCJA </p> </section>
           <section> <p> SEKCJA </p> </section>
           <section> <p> SEKCJA </p> </section>
    </aside>    <footer>    Maciek 2026 </footer>


</body>
</html>
