<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8" />
    <title> Typowa witryna internetowa </title>
    <style type="text/css">

        /*ul{
            list-style:none;
        }*/

        ul, ul.a li.a{
            display:block;
            list-style:none;
            margin:0;
            padding:0;
            width:180px;
            
            
        }

        ul.a a:link, ul.a a:visited{
            display:block;
            width:170px;
            background-color:navy;
            color:white;
            text-decoration:none;
            padding:6px 3px 3px 6px;
            border:2px outset blue;
        }

        ul.a a:hover{
            color:yellow;
            text-decoration:none;
            padding: 6px 3px 3px 6px;
            border:2px inset yellow;
        }


    </style>
</head>
<body>
        
   <ul class="a">
    <ul>

        
        <li><a href="https://www.onet.pl/" target="new">ONET</a></li>
        <li><a href="https://www.wp.pl/" target="new">WP</a></li>
        <li><a href="https://www.interia.pl/" target="new">INTERIA</a></li>
    </ul>
    </ul>
    
    



</body>
</html>
